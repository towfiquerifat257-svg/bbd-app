name: Build BBD APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbd-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter Installation
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Check BBD Flutter Project
        run: |
          set -euo pipefail

          if [[ ! -f app/pubspec.yaml ]]; then
            echo "::error::app/pubspec.yaml not found."
            echo "The Flutter application source must exist inside app/."
            exit 1
          fi

          if [[ ! -d app/android ]]; then
            echo "::error::app/android folder not found."
            exit 1
          fi

          echo "BBD Flutter project found."

      - name: Configure Firebase Android File
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          set -euo pipefail

          if [[ -n "${FIREBASE_CONFIG_JSON:-}" ]]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["FIREBASE_CONFIG_JSON"]
          data = json.loads(raw)

          if not isinstance(data, dict):
              raise SystemExit("Firebase configuration must be a JSON object.")

          if not data.get("project_info", {}).get("project_id"):
              raise SystemExit("Firebase project_id is missing.")

          if not data.get("client"):
              raise SystemExit("Firebase client configuration is missing.")

          target = Path("app/android/app/google-services.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Firebase Android configuration created.")
          PY
          elif [[ -f app/android/app/google-services.json ]]; then
            echo "Using existing Firebase Android configuration."
          else
            echo "Firebase configuration not supplied; continuing."
          fi

      - name: Get Dependencies
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get

      - name: Validate Dart Code
        working-directory: app
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib
          flutter analyze

      - name: Build Release APK
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload BBD APK
        uses: actions/upload-artifact@v4
        with:
          name: BBD-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
