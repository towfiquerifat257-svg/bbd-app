name: Build BBD APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Google Services
        working-directory: app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi

          mkdir -p android/app

          python3 - <<'PY'
          import os
          import json
          import base64
          from pathlib import Path

          value = os.environ["GOOGLE_SERVICES_JSON"].strip()

          try:
              data = json.loads(value)
          except json.JSONDecodeError:
              try:
                  decoded = base64.b64decode(value, validate=True)
                  data = json.loads(decoded.decode("utf-8"))
              except Exception as exc:
                  raise SystemExit(
                      "Invalid Google Services JSON secret."
                  ) from exc

          if not isinstance(data, dict):
              raise SystemExit("Firebase config must be a JSON object.")

          output = Path("android/app/google-services.json")
          output.write_text(
              json.dumps(data, indent=2),
              encoding="utf-8"
          )

          print("Google Services configuration created.")
          PY

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Check Flutter Project
        working-directory: app
        run: flutter analyze --no-pub

      - name: Build Release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBD-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
